name: Infrastructure

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/terraform.yaml"
      - "infra/**"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/terraform.yaml"
      - "infra/**"

permissions:
  contents: read

concurrency:
  group: infrastructure-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Secret-free infrastructure gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the reviewed root without credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Install ShellCheck and shfmt
        run: |
          shellcheck_container=$(docker create koalaman/shellcheck@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d)
          docker cp "$shellcheck_container:/bin/shellcheck" /tmp/shellcheck
          docker rm "$shellcheck_container"
          sudo install -m 0755 /tmp/shellcheck /usr/local/bin/shellcheck
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.12.0
          sudo install -m 0755 "$(go env GOPATH)/bin/shfmt" /usr/local/bin/shfmt

      - name: Run Terraform, Compose, shell, JSON, and regression checks
        run: bash infra/scripts/check-infra.sh

      - name: Scan infrastructure configuration
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --workdir /workspace \
            aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            config --disable-telemetry --exit-code 1 --severity HIGH,CRITICAL \
            --skip-check-update --skip-version-check --skip-dirs '**/.terraform' \
            /workspace/infra

      - name: Scan infrastructure for secrets
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --workdir /workspace \
            aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            fs --disable-telemetry --scanners secret --exit-code 1 \
            --severity HIGH,CRITICAL --skip-version-check --skip-dirs '**/.terraform' \
            /workspace/infra

  release-provenance:
    name: Trusted-push release provenance
    if: github.event_name == 'push'
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out the protected main revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Read exact service commits from gitlinks
        id: service-commits
        run: |
          echo "billing=$(git rev-parse HEAD:apollo-billing-api)" >> "$GITHUB_OUTPUT"
          echo "platform=$(git rev-parse HEAD:apollo-platform-api)" >> "$GITHUB_OUTPUT"
          echo "signal=$(git rev-parse HEAD:apollo-signal-api)" >> "$GITHUB_OUTPUT"

      - name: Check out exact Billing source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Apollo-Deploy/Apollo-Billing-API
          ref: ${{ steps.service-commits.outputs.billing }}
          path: apollo-billing-api
          token: ${{ secrets.SUBMODULES_TOKEN }}
          persist-credentials: false

      - name: Check out exact Platform source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Apollo-Deploy/Apollo-Platform-API
          ref: ${{ steps.service-commits.outputs.platform }}
          path: apollo-platform-api
          token: ${{ secrets.SUBMODULES_TOKEN }}
          persist-credentials: false

      - name: Check out exact Signal source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Apollo-Deploy/Apollo-Signal-API
          ref: ${{ steps.service-commits.outputs.signal }}
          path: apollo-signal-api
          token: ${{ secrets.SUBMODULES_TOKEN }}
          persist-credentials: false

      - name: Install digest-pinned Cosign 3.0.6
        run: |
          container=$(docker create --platform linux/amd64 ghcr.io/sigstore/cosign/cosign@sha256:cdb23f652a55fef7b4b3c0f02fe0742e5a7017709c76c574e05be9febcf5d86e)
          docker cp "$container:/ko-app/cosign" /tmp/cosign
          docker rm "$container"
          sudo install -m 0755 /tmp/cosign /usr/local/bin/cosign

      - name: Verify the approved release catalog
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.SUBMODULES_TOKEN }}
        run: |
          jq -n '{username: env.GHCR_USERNAME, token: env.GHCR_TOKEN}' \
            | bash infra/scripts/lib/verify-approved-releases-ci.sh \
                infra/releases/approved-releases.json

      - name: Publish the verified catalog
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: approved-releases-${{ github.sha }}
          path: infra/releases/approved-releases.json
          if-no-files-found: error
          retention-days: 90
