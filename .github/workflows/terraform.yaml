name: Terraform

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/terraform.yaml"
      - ".gitmodules"
      - "apollo-billing-api"
      - "apollo-platform-api"
      - "apollo-signal-api"
      - "infra/**"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/terraform.yaml"
      - ".gitmodules"
      - "apollo-billing-api"
      - "apollo-platform-api"
      - "apollo-signal-api"
      - "infra/**"

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Terraform quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read

    steps:
      - name: Check out repository and required service sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ secrets.SUBMODULES_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          cache: true
          tflint_version: v0.64.0

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes jq

      - name: Install digest-pinned ShellCheck 0.11.0
        run: |
          container_id=$(docker create koalaman/shellcheck@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d)
          cleanup_shellcheck_container() {
            docker rm --force "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup_shellcheck_container EXIT
          docker cp "$container_id:/bin/shellcheck" /tmp/shellcheck
          sudo install -m 0755 /tmp/shellcheck /usr/local/bin/shellcheck
          test "$(shellcheck --version | awk '$1 == "version:" { print $2; exit }')" = "0.11.0"

      - name: Install digest-pinned Cosign 3.0.6
        run: |
          container_id=$(docker create --platform linux/amd64 ghcr.io/sigstore/cosign/cosign@sha256:cdb23f652a55fef7b4b3c0f02fe0742e5a7017709c76c574e05be9febcf5d86e)
          cleanup_cosign_container() {
            docker rm --force "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup_cosign_container EXIT
          docker cp "$container_id:/ko-app/cosign" /tmp/cosign
          sudo install -m 0755 /tmp/cosign /usr/local/bin/cosign
          test "$(cosign version 2>/dev/null | awk '$1 == "GitVersion:" { print $2; exit }')" = "v3.0.6"

      - name: Verify every committed production release
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          jq -n '{username: env.GHCR_USERNAME, token: env.GHCR_TOKEN}' \
            | bash infra/scripts/lib/verify-approved-releases-ci.sh \
                infra/releases/approved-releases.json

      - name: Run Terraform, shell, and JSON checks
        env:
          APOLLO_CI_RELEASE_VERIFICATION: "true"
        run: bash infra/scripts/check-terraform.sh

      - name: Publish the CI-approved immutable release catalog
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: approved-releases-${{ github.sha }}
          path: infra/releases/approved-releases.json
          if-no-files-found: error
          retention-days: 90

      - name: Scan Terraform for high-severity misconfigurations
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --workdir /workspace \
            aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            config \
            --disable-telemetry \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --skip-check-update \
            --skip-version-check \
            --tf-exclude-downloaded-modules \
            --skip-dirs '**/.terraform' \
            --skip-files '**/*.tfstate*' \
            --skip-files '**/*.tfplan*' \
            --skip-files '**/tfplan' \
            /workspace/infra/terraform

      - name: Scan infrastructure files for secrets
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --workdir /workspace \
            aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            fs \
            --disable-telemetry \
            --scanners secret \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --skip-version-check \
            --skip-dirs '**/.terraform' \
            --skip-files '**/*.tfstate*' \
            --skip-files '**/*.tfplan*' \
            --skip-files '**/tfplan' \
            /workspace/infra
